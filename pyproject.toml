[project]
name = "matplotlib-extension"
version = "0.1.0"
description = "An extension library for matplotlib"
authors = [
    {name = "Yukihiro", email = "12211343+y-marui@users.noreply.github.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.2",
    "numpy>=1.26,<2.5",
    "olefile>=0.47",
    "pypdf>=6.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.2",
    "mypy>=1.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "types-olefile>=0.47.0.20260508",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs/dev-charter"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["matplotlib_extension"]
